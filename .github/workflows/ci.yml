name: CI

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.1"

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # The architecture guard alone takes over 14 min (#422).
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install dependencies
        run: flutter pub get

      - name: Enforce v2 architecture and retained-reference boundaries
        run: make v2-architecture

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated code is committed
        run: |
          if git status --porcelain | grep -E '\.g\.dart$' >/dev/null; then
            echo "::error::Generated files changed. Commit the generated output."
            git status --porcelain
            exit 1
          fi

      - name: Analyze (phased gate)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/flutter_analyze.log

      - name: Enforce analyze issue budget
        run: bash tool/ci/check_analyze_budget.sh /tmp/flutter_analyze.log 337

      - name: Verify coverage gate fixtures
        run: python3 -m unittest discover -s tool/ci -p test_check_coverage.py

      - name: Verify the release plan, publication guards and tooling
        run: python3 -m unittest discover -s tool/release -p 'test_*.py'

      - name: Test browser capabilities
        run: flutter test --no-pub --platform chrome test/web

      - name: Upload analyze report
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: /tmp/flutter_analyze.log

  v2_foundations:
    needs: quality
    runs-on: ubuntu-latest
    # The architecture guard alone takes over 14 min (#422).
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Check v2 packages, architecture and VM/CHP tests (native MVP)
        run: make v2-native-check

  v2_native_checks:
    runs-on: ubuntu-24.04
    # The architecture guard alone takes over 14 min (#422).
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: flutter pub get
      - name: Check all v2 packages and VM/CHP tests without browser prerequisites
        run: make v2-native-check

  v2_native_builds:
    needs: v2_native_checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [android, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - name: Install project-pinned Android NDK
        if: matrix.target == 'android'
        run: bash tool/ci/install_android_ndk.sh
      - name: Install Linux development dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libayatana-appindicator3-dev libsecret-1-dev
      - name: Install isolated native visual QA runtime
        if: matrix.target == 'linux'
        run: sudo apt-get install -y xvfb xauth xdotool imagemagick tesseract-ocr gnome-keyring libsecret-tools dbus-x11
      - run: flutter pub get
      - name: Record compiler environment
        run: |
          mkdir -p build/native-evidence
          git rev-parse HEAD > build/native-evidence/source-commit.txt
          flutter --version --machine > build/native-evidence/flutter.json
          flutter doctor -v > build/native-evidence/doctor.txt
          uname -a > build/native-evidence/host.txt
          df -h > build/native-evidence/disk.txt
      - name: Compile and inspect explicit v2 debug target
        timeout-minutes: 30
        run: |
          set -o pipefail
          make v2-${{ matrix.target }}-debug 2>&1 | tee build/native-evidence/compiler.log
      - name: Package the isolated Linux development preview
        if: success() && matrix.target == 'linux'
        run: make v2-linux-preview-package
      - name: Launch and visually verify the exact packaged preview
        if: success() && matrix.target == 'linux'
        timeout-minutes: 8
        run: |
          timeout --signal=TERM --kill-after=10s 420s xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24 -nolisten tcp" make v2-linux-preview-smoke
      - name: Deliver only a verified native development preview
        if: success() && matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: codewalk-v2-preview-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/native-evidence/codewalk-v2-preview-linux-x64.tar.gz
            build/native-evidence/codewalk-v2-preview-linux-x64.tar.gz.sha256
            build/native-evidence/preview-smoke/
            build/native-evidence/linux.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain compiler evidence (not a release or installed-device pass)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-native-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/native-evidence/*.json
            build/native-evidence/*.txt
            build/native-evidence/*.log
            build/native-evidence/preview-smoke/
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7

  test_shards:
    # Keep PR/branch feedback fast; main/tag pushes run the coverage job instead.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Test shard
        run: flutter test --no-pub -j 4 --total-shards 4 --shard-index ${{ matrix.shard_index }}

  windows_build:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows debug app
        run: flutter build windows --debug

  coverage:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Test (full) with coverage
        # -j 4: the 4-vCPU runners oversubscribe at -j 8 and trip 30s test
        # timeouts in I/O-heavy suites; halves contention, still <35min.
        run: flutter test --no-pub --coverage -j 4

      - name: Enforce coverage threshold
        run: bash tool/ci/check_coverage.sh coverage/lcov.info 35

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.filtered.info
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            coverage/lcov.info
            coverage/lcov.filtered.info
