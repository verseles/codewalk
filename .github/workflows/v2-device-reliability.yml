name: V2 device reliability

# V2-042C emulator cells: the device reliability matrix on an Android 12/API 31
# emulator against a disposable OpenCode 2.0.22 server on this runner, with a
# zero-cost stub provider. Artifacts only: nothing is published, tagged or
# deployed.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.1"
  # The commit of the FLUTTER_VERSION tag; a moved tag fails the SDK check.
  FLUTTER_REVISION: "924134a44c189315be2148659913dda1671cbe99"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api31:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Verify the pinned Flutter SDK
        run: |
          flutter --version
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          python3 - <<'PY'
          import json, os, sys
          sdk = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "flutter-version.json")))
          found = (sdk["frameworkVersion"], sdk["frameworkRevision"])
          if found != (os.environ["FLUTTER_VERSION"], os.environ["FLUTTER_REVISION"]):
              sys.exit(f"Flutter {found} is not the pinned SDK")
          PY
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install project-pinned Android NDK
        run: bash tool/ci/install_android_ndk.sh
      - run: flutter pub get
      - name: Acquire the pinned OpenCode 2.0.22 build
        run: python3 tool/ci/v2_device_server.py acquire --root "$RUNNER_TEMP/cw-device"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the cells on an Android 12 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          pre-emulator-launch-script: timeout --kill-after=10s 30s adb start-server
          script: python3 tool/ci/device_reliability_android.py --root "$RUNNER_TEMP/cw-device" --serial emulator-5554 --out device-evidence
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-device-reliability-api31-${{ github.run_id }}-${{ github.run_attempt }}
          path: device-evidence/
          if-no-files-found: warn
          retention-days: 30
