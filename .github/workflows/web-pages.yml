name: Web Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.1"

jobs:
  deploy-web:
    # Pushes to main skip the preview deploy; run the workflow manually from
    # main to publish a main revision to main.codewalk.pages.dev. The deploy
    # builds the legacy lib/main.dart, so the guard below refuses any other
    # ref and any CodeWalk 2 version (V1-04 precedes a v2 Web deploy).
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse a v2-labelled legacy build
        run: python3 tool/release/guard_legacy_build.py pubspec.yaml --web-ref "$GITHUB_REF"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: make web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=codewalk --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
