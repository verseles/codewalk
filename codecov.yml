coverage:
  precision: 2
  round: down
  range: "85...100"
  status:
    project:
      default:
        target: 85%
        threshold: 3%
    patch:
      default:
        target: 80%
        threshold: 10%

ignore:
  - "test/**/*"
  - "**/*.g.dart"
  - "**/generated_plugin_registrant.dart"
  - "lib/shared/l10n/generated/**"
  - "packages/**"
